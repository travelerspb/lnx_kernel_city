<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Linux kernel drawn as a city: follow a read() from user space to the disk and back. A model, not a running kernel." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%226%22 width=%223%22 height=%228%22 fill=%22%232563c9%22/%3E%3Crect x=%226%22 y=%223%22 width=%224%22 height=%2211%22 fill=%22%23c2570c%22/%3E%3Crect x=%2211%22 y=%228%22 width=%223%22 height=%226%22 fill=%22%2316803c%22/%3E%3C/svg%3E" />
    <title>Linux Kernel City</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #city { position: fixed; top: 0; left: 0; width: calc(100vw - var(--lkc-log-w, 0px) - 1rem); height: 100vh; display: block; }
      @media (max-width: 720px) { #city { width: 100vw; } #status { width: max-content; font-size: 11px; } }
      #status { position: fixed; left: 50%; bottom: 0.5rem; transform: translateX(-50%); margin: 0;
        font: 12px system-ui, sans-serif; opacity: 0.7; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="city" aria-label="Map of the kernel city"></canvas>
    <div id="ui"></div>
    <p id="status">A model of Linux 6.18, not a running kernel.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
